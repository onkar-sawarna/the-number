<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet"/>
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 72px 88px;
      background: #eef3fb;
      background-image:
        radial-gradient(ellipse 90% 55% at 110% -10%, rgba(43, 108, 239, 0.28), transparent 55%),
        radial-gradient(ellipse 55% 45% at -8% 18%, rgba(56, 189, 248, 0.28), transparent 52%);
      color: #0f1b33;
      font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
    }
    .kicker {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #2b6cef;
    }
    h1 {
      margin: 22px 0 0;
      font-family: Fraunces, ui-serif, Georgia, serif;
      font-size: 112px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 0.95;
    }
    .line {
      margin: 28px 0 0;
      max-width: 920px;
      font-family: Fraunces, ui-serif, Georgia, serif;
      font-size: 36px;
      font-weight: 600;
      line-height: 1.25;
      color: rgba(15, 27, 51, 0.78);
    }
  </style>
</head>
<body>
  <p class="kicker">Financial Independence, Retire Early</p>
  <h1>the number</h1>
  <p class="line">Know the corpus that lets you stop.</p>
</body>
</html>
